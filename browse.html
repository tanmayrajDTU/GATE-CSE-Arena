<style>
  /* Scoped to the browse page only — nothing here affects other pages. */
  .browse-card { margin-bottom: 16px; padding: 18px 20px; }
  .browse-card .q-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .browse-answer { margin-top: 14px; }
  .browse-answer[hidden] { display: none; }
  .answer-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--correct); color: var(--correct);
    background: var(--correct-wash); font-size: 0.85rem; font-weight: 600;
  }
  .browse-toolbar { padding: 18px 22px; margin-bottom: 18px; display: flex; gap: 24px; flex-wrap: wrap; }
  .browse-toolbar .field-label { display: block; }
  .browse-input {
    background: var(--panel-inset); color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 8px 10px; font: inherit; font-size: 0.85rem; min-width: 230px;
  }
  .browse-input:focus { outline: none; box-shadow: var(--focus-ring); }
  .browse-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 22px 0 8px; flex-wrap: wrap; }
  .browse-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
</style>
