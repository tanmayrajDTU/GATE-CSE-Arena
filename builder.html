<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131A">
<title>Build a test — GATE CSE PYQ Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="grid-bg">

<div class="mobile-bar">
  <a class="rail-brand" href="index.html"><span class="mark">GATE·CSE</span><span class="name">PYQ Console</span></a>
  <button id="mobile-toggle" class="btn ghost small">Menu</button>
</div>

<div class="shell">
  <nav class="rail" id="rail-mount"></nav>

  <main class="main" id="page-main">
    <div style="margin-bottom:22px;">
      <div class="subtle mono" style="font-size:12px; margin-bottom:6px;">CUSTOM SET</div>
      <h1 class="display-title" style="font-size:28px;">Build a test</h1>
      <p class="soft" style="font-size:14px; margin-top:6px;">Combine subject, topic-adjacent year, difficulty and type filters into one practice set — timed or not.</p>
    </div>

    <div class="panel panel-pad" style="margin-bottom:22px;">
      <label class="field-label">Subjects</label>
      <div class="chip-row" id="subject-chips" style="margin-bottom:18px;"></div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px;">
        <div>
          <label class="field-label">Type</label>
          <div class="chip-row" id="type-chips">
            ${["all", "MCQ", "MSQ", "NAT"].map(t => `<label class="chip ${t === 'all' ? 'active' : ''}" data-val="${t}">${t === "all" ? "All" : t}</label>`).join("")}
          </div>
        </div>
        <div>
          <label class="field-label">Difficulty</label>
          <div class="chip-row" id="diff-chips">
            ${["all", "easy", "medium", "hard", "unknown"].map(d => `<label class="chip ${d === 'all' ? 'active' : ''}" data-val="${d}">${d === "all" ? "All" : (d === "unknown" ? "Unrated" : d[0].toUpperCase() + d.slice(1))}</label>`).join("")}
          </div>
        </div>
        <div>
          <label class="field-label">From year</label>
          <select id="year-from"></select>
        </div>
        <div>
          <label class="field-label">To year</label>
          <select id="year-to"></select>
        </div>
      </div>

      <hr class="rule">

      <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-end;">
        <label class="chip" id="bookmarks-chip"><input type="checkbox" id="bookmarks-only">Bookmarked only</label>
        <div>
          <label class="field-label">Limit questions to</label>
          <input type="number" id="limit-input" min="1" placeholder="all matched" style="width:140px;">
        </div>
        <div style="margin-left:auto; text-align:right;">
          <div class="stat-num mono" id="match-total" style="font-size:24px;">0</div>
          <div class="stat-label">questions match</div>
        </div>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn ghost" id="reset-btn">Reset filters</button>
      <button class="btn accent" id="build-btn">Continue</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/launcher.js"></script>
<script src="assets/js/builder.js"></script>
</body>
</html>
